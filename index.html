<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1216" />
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="level" aria-hidden="true"></div>

    <button
      class="drawer-toggle"
      type="button"
      data-history-toggle
      aria-expanded="false"
      aria-controls="history-drawer"
    >
      History
    </button>

    <main class="app" id="app">
      <section class="session">
        <div class="task" data-title-field>
          <label class="task__label" for="session-title">Task</label>
          <input
            class="task__input"
            id="session-title"
            type="text"
            data-title
            placeholder="What are you working on?"
          />
        </div>

        <div class="dial" aria-hidden="true">
          <span class="dial__hand"></span>
        </div>

        <p class="session__mode" data-mode>Focus</p>
        <p class="session__time" data-time role="timer" aria-live="off">25:00</p>

        <div class="controls">
          <button class="button button--primary" type="button" data-primary>
            Start
          </button>
          <button class="button button--secondary" type="button" data-reset>
            Reset
          </button>
        </div>

        <div class="rounds">
          <div class="rounds__dots" data-dots aria-hidden="true"></div>
          <p class="rounds__count" data-count>0 sessions</p>
        </div>
      </section>

      <details class="panel">
        <summary class="panel__toggle">Settings</summary>

        <div class="panel__body fields">
          <label class="field">
            <span class="field__name">Focus</span>
            <input
              class="field__input"
              type="number"
              inputmode="numeric"
              step="1"
              data-focus-minutes
            />
            <span class="field__unit">min</span>
          </label>

          <label class="field">
            <span class="field__name">Short break</span>
            <input
              class="field__input"
              type="number"
              inputmode="numeric"
              step="1"
              data-short-break-minutes
            />
            <span class="field__unit">min</span>
          </label>

          <label class="field">
            <span class="field__name">Long break</span>
            <input
              class="field__input"
              type="number"
              inputmode="numeric"
              step="1"
              data-long-break-minutes
            />
            <span class="field__unit">min</span>
          </label>
        </div>
      </details>
    </main>

    <div class="scrim" data-history-scrim></div>

    <aside
      class="drawer"
      id="history-drawer"
      data-history-drawer
      aria-label="History"
      tabindex="-1"
      inert
    >
      <h2 class="drawer__title">History</h2>

      <ul class="history" data-history></ul>

      <p class="history__empty" data-history-empty>
        Finish a focus session and it will show up here.
      </p>

      <button class="history__clear" type="button" data-history-clear>
        Clear history
      </button>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
