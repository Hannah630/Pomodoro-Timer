<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="level" aria-hidden="true"></div>

    <main class="app" id="app">
      <section class="session">
        <p class="session__mode" data-mode>Focus</p>
        <p class="session__time" data-time role="timer" aria-live="off">25:00</p>

        <div class="controls">
          <button class="button button--primary" type="button" data-primary>
            Start
          </button>
          <button class="button button--secondary" type="button" data-reset>
            Reset
          </button>
        </div>

        <div class="rounds">
          <div class="rounds__dots" data-dots aria-hidden="true"></div>
          <p class="rounds__count" data-count>0 sessions</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
