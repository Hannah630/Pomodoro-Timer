<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1216" />
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="level" aria-hidden="true"></div>

    <main class="app" id="app">
      <section class="session">
        <p class="session__mode" data-mode>Focus</p>
        <p class="session__time" data-time role="timer" aria-live="off">25:00</p>

        <div class="controls">
          <button class="button button--primary" type="button" data-primary>
            Start
          </button>
          <button class="button button--secondary" type="button" data-reset>
            Reset
          </button>
        </div>

        <div class="rounds">
          <div class="rounds__dots" data-dots aria-hidden="true"></div>
          <p class="rounds__count" data-count>0 sessions</p>
        </div>
      </section>

      <details class="settings">
        <summary class="settings__toggle">Settings</summary>

        <div class="settings__fields">
          <label class="field">
            <span class="field__name">Focus</span>
            <input
              class="field__input"
              type="number"
              inputmode="numeric"
              step="1"
              data-focus-minutes
            />
            <span class="field__unit">min</span>
          </label>

          <label class="field">
            <span class="field__name">Short break</span>
            <input
              class="field__input"
              type="number"
              inputmode="numeric"
              step="1"
              data-short-break-minutes
            />
            <span class="field__unit">min</span>
          </label>

          <label class="field">
            <span class="field__name">Long break</span>
            <input
              class="field__input"
              type="number"
              inputmode="numeric"
              step="1"
              data-long-break-minutes
            />
            <span class="field__unit">min</span>
          </label>
        </div>
      </details>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
