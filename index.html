<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1216" />
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="watermark" aria-hidden="true"></div>
    <div class="level" aria-hidden="true"></div>

    <div class="toolbar">
      <button
        class="drawer-toggle"
        type="button"
        data-settings-toggle
        aria-expanded="false"
        aria-controls="settings-drawer"
      >
        Settings
      </button>

      <button
        class="drawer-toggle"
        type="button"
        data-history-toggle
        aria-expanded="false"
        aria-controls="history-drawer"
      >
        History
      </button>
    </div>

    <main class="app" id="app">
      <section class="session">
        <div class="session__instrument">
          <div class="dial" aria-hidden="true">
            <span class="dial__hand"></span>
          </div>

          <p class="session__mode" data-mode>Focus · 1/4</p>

          <p class="session__time" role="timer" aria-live="off">
            <span data-clock>25:00</span
            ><span class="session__centiseconds" data-centiseconds>00</span>
          </p>

          <p class="session__next" data-next>Next: short break</p>
        </div>

        <div class="controls">
          <button class="button button--primary" type="button" data-primary>
            Start
          </button>
          <button class="button button--secondary" type="button" data-reset>
            Reset
          </button>
        </div>

        <div class="task" data-title-field>
          <label class="task__label" for="session-title">Task</label>
          <input
            class="task__input"
            id="session-title"
            type="text"
            data-title
            placeholder="What are you working on?"
          />
        </div>
      </section>
    </main>

    <div class="scrim" data-scrim></div>

    <aside
      class="drawer drawer--settings"
      id="settings-drawer"
      data-settings-drawer
      aria-label="Settings"
      tabindex="-1"
      inert
    >
      <h2 class="drawer__title">Settings</h2>

      <div class="fields">
        <p class="fields__head" aria-hidden="true">
          <span class="fields__unit">min</span>
          <span class="fields__unit">sec</span>
        </p>

        <label class="field">
          <span class="field__name">Focus</span>
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            aria-label="Focus minutes"
            data-focus-minutes
          />
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            max="59"
            aria-label="Focus seconds"
            data-focus-seconds
          />
        </label>

        <label class="field">
          <span class="field__name">Short break</span>
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            aria-label="Short break minutes"
            data-short-break-minutes
          />
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            max="59"
            aria-label="Short break seconds"
            data-short-break-seconds
          />
        </label>

        <label class="field">
          <span class="field__name">Long break</span>
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            aria-label="Long break minutes"
            data-long-break-minutes
          />
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            max="59"
            aria-label="Long break seconds"
            data-long-break-seconds
          />
        </label>
      </div>
    </aside>

    <aside
      class="drawer drawer--history"
      id="history-drawer"
      data-history-drawer
      aria-label="History"
      tabindex="-1"
      inert
    >
      <h2 class="drawer__title">History</h2>

      <p class="drawer__summary" data-history-summary>0 sessions · 0 min today</p>

      <p class="drawer__lifetime" data-history-lifetime hidden>
        All time · 0 sessions · 0 min
      </p>

      <ul class="history" data-history></ul>

      <p class="history__empty" data-history-empty>
        Finish a focus session and it will show up here.
      </p>

      <button class="history__clear" type="button" data-history-clear>
        Clear history
      </button>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
