<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page use the whole screen on a phone with
      rounded corners or a notch — and makes env(safe-area-inset-*) report
      something other than zero, which is what keeps the toolbar out from
      under the notch and the buttons off the home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- One per theme, so the browser chrome matches the page it frames. -->
    <meta
      name="theme-color"
      content="#0f1216"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f4f2"
      media="(prefers-color-scheme: light)"
    />

    <!--
      Vite rewrites this path with the configured base, so it resolves both on
      the dev server at / and on Pages under /Pomodoro-Timer/. Without it every
      load spends a request on a /favicon.ico that was never there.
    -->
    <link rel="icon" href="/tomato.svg" type="image/svg+xml" />

    <!--
      Installable, so the timer can be opened from the home screen instead of
      from a tab.

      Not only a convenience. In a tab the browser's own bars sit over the
      notch and the home indicator, so every safe-area inset reads as zero
      and the layout that clears them is never exercised. Run from the home
      screen the page owns the whole screen — which is also what a native
      shell will hand it, so this is the honest place to check that work.

      Paths are relative inside the manifest, because this is served from
      /Pomodoro-Timer/ on Pages and from the root inside a shell. Vite
      rewrites the two absolute ones below with the configured base.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      iOS reads none of the above for this.

      The home screen icon comes from apple-touch-icon and must be a PNG —
      an SVG there is ignored, and what iOS falls back to is a screenshot of
      the page. The standalone mode comes from apple-mobile-web-app-capable
      rather than the manifest's display, which is what lets this be tested
      over a plain http address on the local network, before anything is
      deployed.

      black-translucent puts the page under the status bar, which is the
      point: it is the only setting that makes safe-area-inset-top anything
      other than zero, and it is what a native iOS shell does by default. The
      cost is that iOS then draws the clock and battery in white whatever the
      page is doing, so the light theme has to be looked at.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pomodoro" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="watermark" aria-hidden="true"></div>
    <div class="level" aria-hidden="true"></div>

    <!--
      The end of a session is announced here.

      The dial is aria-hidden and the clock is aria-live="off" — a countdown
      that read itself out sixty times a second would be unusable — so with
      nothing else, a screen reader user gets no signal at all that the time
      is up. The chime needs sound and the notification needs permission;
      this needs neither.
    -->
    <p
      class="visually-hidden"
      role="status"
      aria-live="polite"
      data-announce
    ></p>

    <div class="toolbar">
      <button
        class="drawer-toggle"
        type="button"
        data-settings-toggle
        aria-expanded="false"
        aria-controls="settings-drawer"
      >
        Settings
      </button>

      <button
        class="drawer-toggle"
        type="button"
        data-history-toggle
        aria-expanded="false"
        aria-controls="history-drawer"
      >
        History
      </button>
    </div>

    <main class="app" id="app">
      <section class="session">
        <div class="session__instrument">
          <!--
            The time of day, above everything. Filled in before the first
            paint, so unlike the weather it needs no space held for it.
          -->
          <p class="local-time" data-local-time></p>

          <!--
            Above the dial, and empty until there is something to say.

            A line that reads "unavailable" would sit over the countdown for
            good on any device that will not give a position — so nothing is
            said instead. The space it will occupy is reserved in CSS, so the
            instrument below does not move when the reading arrives.
          -->
          <p class="weather" data-weather aria-live="polite"></p>

          <div class="dial" aria-hidden="true">
            <span class="dial__hand"></span>
          </div>

          <div class="modes" role="group" aria-label="Session mode">
            <button
              class="mode"
              type="button"
              data-mode-focus
              aria-pressed="true"
            >
              Focus
            </button>
            <button
              class="mode"
              type="button"
              data-mode-break
              aria-pressed="false"
            >
              Break
            </button>
          </div>

          <p class="session__time" role="timer" aria-live="off">
            <span data-clock>25:00</span
            ><span class="session__centiseconds" data-centiseconds>00</span>
          </p>

          <p class="session__today" data-today>0 today</p>

          <p class="session__hint" data-hint hidden>Paused — you left</p>
        </div>

        <div class="controls">
          <button class="button button--primary" type="button" data-primary>
            Start
          </button>
          <button class="button button--secondary" type="button" data-reset>
            Reset
          </button>
        </div>

        <div class="task" data-title-field>
          <label class="task__label" for="session-title">Task</label>
          <input
            class="task__input"
            id="session-title"
            type="text"
            data-title
            placeholder="What are you working on?"
          />
        </div>
      </section>
    </main>

    <div class="scrim" data-scrim></div>

    <aside
      class="drawer drawer--settings"
      id="settings-drawer"
      data-settings-drawer
      aria-label="Settings"
      tabindex="-1"
      inert
    >
      <h2 class="drawer__title">Settings</h2>

      <div class="fields">
        <p class="fields__head" aria-hidden="true">
          <span class="fields__unit">min</span>
          <span class="fields__unit">sec</span>
        </p>

        <label class="field">
          <span class="field__name">Focus</span>
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            aria-label="Focus minutes"
            data-focus-minutes
          />
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            max="59"
            aria-label="Focus seconds"
            data-focus-seconds
          />
        </label>

        <label class="field">
          <span class="field__name">Break</span>
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            aria-label="Break minutes"
            data-break-minutes
          />
          <input
            class="field__input"
            type="number"
            inputmode="numeric"
            step="1"
            min="0"
            max="59"
            aria-label="Break seconds"
            data-break-seconds
          />
        </label>
      </div>

      <!--
        Stacked rather than laid out as a row like the durations above: three
        pills and a label do not fit across a 22rem drawer.

        Same buttons as the mode switcher on the main screen, because they do
        the same job — one of a small set, exactly one of them on.
      -->
      <div role="group" aria-label="Theme">
        <span class="field__name field__name--stacked">Theme</span>

        <div class="modes">
          <button
            class="mode mode--compact"
            type="button"
            data-theme-system
            aria-pressed="true"
          >
            System
          </button>
          <button
            class="mode mode--compact"
            type="button"
            data-theme-light
            aria-pressed="false"
          >
            Light
          </button>
          <button
            class="mode mode--compact"
            type="button"
            data-theme-dark
            aria-pressed="false"
          >
            Dark
          </button>
        </div>
      </div>
    </aside>

    <aside
      class="drawer drawer--history"
      id="history-drawer"
      data-history-drawer
      aria-label="History"
      tabindex="-1"
      inert
    >
      <h2 class="drawer__title">History</h2>

      <p class="drawer__summary" data-history-summary>
        0 sessions · 0 min today
      </p>

      <p class="drawer__lifetime" data-history-lifetime hidden>
        All time · 0 sessions · 0 min
      </p>

      <ul class="history" data-history></ul>

      <p class="history__empty" data-history-empty>
        Finish a focus session and it will show up here.
      </p>

      <button class="history__clear" type="button" data-history-clear>
        Clear history
      </button>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
