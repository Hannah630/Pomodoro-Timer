<!--
  The watermark tile. Used as a CSS mask, so the shapes only supply an alpha
  channel and the colour comes from a token in the stylesheet.

  Two tomatoes at different sizes and offsets, so the repeat does not read as
  a grid.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <circle cx="44" cy="54" r="24" />
    <path d="M44 30v-9" />
    <path d="M44 30 30 23M44 30l14-7M44 30l-10 10M44 30l10 10" />

    <circle cx="118" cy="120" r="16" />
    <path d="M118 104v-6" />
    <path d="M118 104l-10-5M118 104l10-5M118 104l-7 7M118 104l7 7" />
  </g>
</svg>
